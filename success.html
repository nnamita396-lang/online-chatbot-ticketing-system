<!DOCTYPE html>
<html>
<head>
    <title>Ticket Created</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <div class="logo">TicketBot</div>
    <div>
        <a href="/">Home</a>
        <a href="/ticket">Create Ticket</a>
        <a href="/tickets">View Tickets</a>
    </div>
</nav>

<div class="form-container">
    <div class="card center">
        <h1>Ticket Created Successfully</h1>
        <p>Thank you, {{ name }}.</p>
        <p>Your ticket number is:</p>
        <div class="ticket-number">#{{ ticket_id }}</div>
        <p>Please keep this number for your reference.</p>
        <a class="btn" href="/tickets">View Tickets</a>
    </div>
</div>
</body>
</html>
